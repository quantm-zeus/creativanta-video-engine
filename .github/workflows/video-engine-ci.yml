name: Video Engine CI

on:
  pull_request:
    branches: [staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Video Engine
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate documentation, backlog, links
        run: python3 scripts/validate_repo.py
      - name: Verify harness syntax
        run: python3 -m py_compile tooling/agent_harness/supervisor.py
      - name: Test supervisor, retry and CI gates
        run: python3 -m unittest discover -s tooling/agent_harness/tests -v
      - name: Validate project tests when available
        shell: bash
        run: |
          if [ -f package.json ]; then
            if [ -f pnpm-lock.yaml ]; then
              corepack enable
              pnpm install --frozen-lockfile
              pnpm -r --if-present lint
              pnpm -r --if-present typecheck
              pnpm -r --if-present test
              pnpm -r --if-present build
            elif [ -f package-lock.json ]; then
              npm ci
              npm run lint --if-present
              npm run typecheck --if-present
              npm test --if-present
              npm run build --if-present
            else
              echo "Project package.json found without lockfile"
              exit 1
            fi
          fi
      - name: Verify real API process fails closed without backend
        run: node scripts/api-real-process-smoke.mjs
